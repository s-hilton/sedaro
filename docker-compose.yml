services:
  web:
    container_name: web
    build: web
    ports:
      - '3030:3030'
    environment:
      # Where the web dev server forwards `/api` requests: the backend service on the compose network.
      - API_URL=http://app:8000
    volumes:
      - ./web/:/web/
      - /web/node_modules/
  app:
    container_name: app
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - '8000:8000'
    volumes:
      - ./app/:/app/
      - /app/instance/
